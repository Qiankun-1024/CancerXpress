name: Runtime and documentation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
          python -m pip install dist/*.whl
          python -m pip check
      - name: Test installed code outside the checkout
        env:
          CUDA_VISIBLE_DEVICES: "-1"
          TF_CPP_MIN_LOG_LEVEL: "3"
          TF_ENABLE_ONEDNN_OPTS: "0"
          OPENBLAS_NUM_THREADS: "1"
          TF_NUM_INTRAOP_THREADS: "2"
          TF_NUM_INTEROP_THREADS: "2"
        run: |
          mkdir -p "$RUNNER_TEMP/cx-tests/tests" "$RUNNER_TEMP/cx-tests/scripts"
          cp tests/test_*.py "$RUNNER_TEMP/cx-tests/tests/"
          cp scripts/*.py "$RUNNER_TEMP/cx-tests/scripts/"
          cd "$RUNNER_TEMP/cx-tests"
          python -c "import cancerxpress; assert 'site-packages' in cancerxpress.__file__"
          python -m unittest discover -s tests -v
          cancerxpress --help
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m mkdocs build --strict
