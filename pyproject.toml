[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cancerxpress"
version = "1.1.0"
description = "CancerXpress: pretrained RNA expression foundation model for batch correction and cancer downstream prediction"
readme = "README.md"
requires-python = ">=3.8,<3.14"
license = {file = "LICENSE"}
classifiers = [
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
authors = [
  { name = "CancerXpress Team" }
]
dependencies = [
  "tensorflow>=2.13.1,<2.14; python_version < '3.9'",
  "tensorflow>=2.20,<2.21; python_version >= '3.9'",
  "tf-keras>=2.20,<2.21; python_version >= '3.9'",
  "numpy>=1.22,<2; python_version < '3.13'",
  "numpy>=2.1,<2.3; python_version >= '3.13'",
  "pandas>=1.5,<2.3",
  "scipy>=1.10,<1.16",
  "requests>=2.32.4,<3"
]

[project.urls]
Repository = "https://github.com/Qiankun-1024/CancerXpress"
Documentation = "https://github.com/Qiankun-1024/CancerXpress#readme"
Issues = "https://github.com/Qiankun-1024/CancerXpress/issues"

[project.scripts]
cancerxpress = "cancerxpress.cli:main"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["cancerxpress*"]
